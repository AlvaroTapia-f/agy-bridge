name: agy-bridge

x-agy-image: &agy-image
  build:
    context: .
  image: agy-bridge:local
  environment:
    HOME: /home/agy
    AGY_BIN: /home/agy/.local/bin/agy
    AGY_SECRETS_DIR: /home/agy/.local/share/agy-secrets
    KEYRING_PASSWORD_FILE: /home/agy/.local/share/agy-secrets/keyring_password

services:
  init-secrets:
    <<: *agy-image
    profiles: ["tools"]
    volumes:
      - agy-secrets:/home/agy/.local/share/agy-secrets
    command: ["bash", "/app/docker/init-secrets.sh"]

  agy-auth:
    <<: *agy-image
    profiles: ["tools"]
    stdin_open: true
    tty: true
    environment:
      HOME: /home/agy
      AGY_BIN: /home/agy/.local/bin/agy
      AGY_SECRETS_DIR: /home/agy/.local/share/agy-secrets
      KEYRING_PASSWORD_FILE: /home/agy/.local/share/agy-secrets/keyring_password
    volumes:
      - agy-config:/home/agy/.gemini
      - agy-keyring:/home/agy/.local/share/keyrings
      - agy-secrets:/home/agy/.local/share/agy-secrets
    command: ["bash", "/app/docker/auth.sh"]

  print-token:
    <<: *agy-image
    profiles: ["tools"]
    volumes:
      - agy-secrets:/home/agy/.local/share/agy-secrets
    command: [
      "bash",
      "-lc",
      "/app/docker/init-secrets.sh && /app/docker/print-token.sh",
    ]

  agy-bridge:
    <<: *agy-image
    restart: unless-stopped
    environment:
      HOME: /home/agy
      AGY_BIN: /home/agy/.local/bin/agy
      AGY_SECRETS_DIR: /home/agy/.local/share/agy-secrets
      KEYRING_PASSWORD_FILE: /home/agy/.local/share/agy-secrets/keyring_password
      HOSTNAME: 0.0.0.0
      PORT: "7421"
      STATE_DIR: /home/agy/.local/state/agy-bridge
      MAX_CONCURRENT: "1"
      PRINT_TIMEOUT: 20m
      AGY_TOOLS: "on"
      AGY_TOOL_SCHEMA: full
      AGY_REUSE: "off"
    volumes:
      - agy-config:/home/agy/.gemini
      - agy-keyring:/home/agy/.local/share/keyrings
      - agy-secrets:/home/agy/.local/share/agy-secrets
      - bridge-state:/home/agy/.local/state/agy-bridge
    ports:
      - "127.0.0.1:7421:7421"
    command: ["bash", "/app/docker/start-bridge.sh"]
    healthcheck:
      test: ["CMD", "bash", "/app/docker/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  test:
    <<: *agy-image
    profiles: ["test"]
    environment:
      HOME: /home/agy
      AGY_BIN: /home/agy/.local/bin/agy
      AGY_SECRETS_DIR: /tmp/agy-secrets
      KEYRING_PASSWORD_FILE: /tmp/agy-secrets/keyring_password
    command:
      - bash
      - -lc
      - |
          set -euo pipefail
          "$$AGY_BIN" --version
          for script in /app/docker/*.sh; do
            bash -n "$$script"
          done
          /app/docker/init-secrets.sh
          test "$(stat -c %a /tmp/agy-secrets)" = "700"
          test "$(stat -c %a /tmp/agy-secrets/bridge_token)" = "600"
          test "$(stat -c %a /tmp/agy-secrets/keyring_password)" = "600"

volumes:
  agy-config:
  agy-keyring:
  agy-secrets:
  bridge-state:
